# Bias detector training configuration
base_model: distilbert-base-uncased
num_labels: 2
learning_rate: 2.0e-5
batch_size: 16
epochs: 3
output_dir: models/bias
validation_split: 0.2
seed: 42
dataset_paths:
  synthetic: data/synthetic_bias.jsonl
  stereoset: data/raw/stereoset.json
  crows_pairs: data/raw/crows_pairs.csv
